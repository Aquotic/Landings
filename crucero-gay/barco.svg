<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-label="Ilustración de un gran crucero navegando al atardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2a7a"/>
      <stop offset=".38" stop-color="#b8428f"/>
      <stop offset=".72" stop-color="#ff7a6b"/>
      <stop offset="1" stop-color="#ffc27a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d4f9e"/>
      <stop offset="1" stop-color="#14204f"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff6d9"/>
      <stop offset=".6" stop-color="#ffd98a"/>
      <stop offset="1" stop-color="#ffb36b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e2f0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b3d7a"/>
      <stop offset=".5" stop-color="#5a6fb8"/>
      <stop offset="1" stop-color="#2b3d7a"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a" stop-opacity=".75"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="335" r="150" fill="url(#sun)"/>
  <circle cx="690" cy="335" r="62" fill="#fff1c9"/>

  <g fill="#ffffff" opacity=".22">
    <ellipse cx="200" cy="120" rx="120" ry="14"/>
    <ellipse cx="260" cy="104" rx="70" ry="12"/>
    <ellipse cx="760" cy="150" rx="140" ry="12"/>
    <ellipse cx="540" cy="80" rx="80" ry="9"/>
  </g>

  <!-- costa lejana -->
  <path d="M0 372 C80 352 150 340 230 350 C300 358 340 338 400 344 L400 380 L0 380 Z" fill="#6b3f86" opacity=".55"/>

  <rect y="378" width="960" height="222" fill="url(#sea)"/>
  <path d="M600 378 L780 378 L860 600 L520 600 Z" fill="url(#refl)"/>
  <g stroke="#ffffff" stroke-linecap="round" opacity=".28">
    <path d="M60 430 H180" stroke-width="3"/>
    <path d="M640 420 H760" stroke-width="3"/>
    <path d="M700 470 H860" stroke-width="3"/>
    <path d="M120 520 H260" stroke-width="3"/>
    <path d="M560 545 H700" stroke-width="3"/>
    <path d="M820 520 H930" stroke-width="2"/>
  </g>

  <!-- barco -->
  <g transform="translate(70 196)">
    <!-- casco -->
    <path d="M0 176 L700 176 L742 140 L760 140 L734 214 Q380 232 22 216 Z" fill="url(#hull)"/>
    <path d="M18 206 Q380 224 736 204 L728 222 Q380 240 26 226 Z" fill="#1d2a5e"/>
    <!-- cubiertas -->
    <path d="M36 176 L36 132 L712 132 L736 176 Z" fill="url(#hull)"/>
    <path d="M58 132 L58 96 L680 96 L708 132 Z" fill="url(#hull)"/>
    <path d="M90 96 L90 64 L640 64 L668 96 Z" fill="url(#hull)"/>
    <path d="M140 64 L140 38 L560 38 L586 64 Z" fill="url(#hull)"/>
    <!-- balcones -->
    <rect x="46" y="143" width="660" height="10" rx="2" fill="url(#glass)"/>
    <rect x="46" y="160" width="672" height="8" rx="2" fill="url(#glass)"/>
    <rect x="68" y="105" width="612" height="9" rx="2" fill="url(#glass)"/>
    <rect x="68" y="119" width="622" height="7" rx="2" fill="url(#glass)"/>
    <rect x="100" y="72" width="540" height="8" rx="2" fill="url(#glass)"/>
    <rect x="100" y="84" width="550" height="6" rx="2" fill="url(#glass)"/>
    <rect x="150" y="45" width="410" height="7" rx="2" fill="url(#glass)"/>
    <!-- luces cálidas -->
    <g fill="#ffd98a">
      <rect x="120" y="145" width="6" height="6"/><rect x="210" y="145" width="6" height="6"/><rect x="330" y="145" width="6" height="6"/><rect x="460" y="145" width="6" height="6"/><rect x="590" y="145" width="6" height="6"/>
      <rect x="160" y="107" width="6" height="5"/><rect x="290" y="107" width="6" height="5"/><rect x="410" y="107" width="6" height="5"/><rect x="540" y="107" width="6" height="5"/>
      <rect x="240" y="74" width="6" height="5"/><rect x="380" y="74" width="6" height="5"/><rect x="500" y="74" width="6" height="5"/>
    </g>
    <!-- proa acristalada -->
    <path d="M640 64 L668 96 L708 132 L736 176 L712 176 L690 134 L660 98 L636 70 Z" fill="#9fb3e8" opacity=".85"/>
    <!-- chimenea -->
    <path d="M250 38 L262 4 L322 4 L318 38 Z" fill="#ffffff"/>
    <rect x="260" y="-2" width="64" height="8" rx="2" fill="#1d2a5e"/>
    <!-- mástil con bandera arcoíris -->
    <path d="M470 38 V-28" stroke="#ffffff" stroke-width="3"/>
    <g transform="translate(472 -28)">
      <rect width="46" height="5" fill="#e40303"/>
      <rect y="5" width="46" height="5" fill="#ff8c00"/>
      <rect y="10" width="46" height="5" fill="#ffed00"/>
      <rect y="15" width="46" height="5" fill="#008026"/>
      <rect y="20" width="46" height="5" fill="#24408e"/>
      <rect y="25" width="46" height="5" fill="#732982"/>
    </g>
    <!-- tobogán -->
    <path d="M190 38 C170 4 220 -4 214 18 C208 38 170 30 182 8" fill="none" stroke="#ff4f8b" stroke-width="6" stroke-linecap="round"/>
    <!-- botes salvavidas -->
    <g fill="#ff9a3c">
      <rect x="110" y="170" width="34" height="9" rx="4"/><rect x="170" y="170" width="34" height="9" rx="4"/><rect x="230" y="170" width="34" height="9" rx="4"/>
      <rect x="430" y="170" width="34" height="9" rx="4"/><rect x="490" y="170" width="34" height="9" rx="4"/><rect x="550" y="170" width="34" height="9" rx="4"/>
    </g>
  </g>
  <!-- estela -->
  <path d="M80 418 Q300 440 830 410" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".5"/>
  <path d="M40 432 Q90 428 140 432" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".45"/>
</svg>
